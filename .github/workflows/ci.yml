name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fire_backend
          POSTGRES_USER: application_runtime
          POSTGRES_PASSWORD: fire_backend_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U application_runtime -d fire_backend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-not-for-production
      POSTGRES_DB: fire_backend
      POSTGRES_USER: application_runtime
      POSTGRES_PASSWORD: fire_backend_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements/dev.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Django checks
        run: python manage.py check
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy apps config manage.py
      - name: Security scan
        run: bandit -r apps config manage.py --exclude "*/tests/*,*/migrations/*"
      - name: Dependency audit
        run: pip-audit -r requirements/base.txt && pip-audit -r requirements/dev.txt
      - name: Tests
        run: pytest
