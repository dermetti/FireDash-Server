name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-not-for-production

      POSTGRES_DB: fire_backend
      POSTGRES_USER: database_owner
      POSTGRES_PASSWORD: database_owner_ci
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      DJANGO_ALLOWED_HOSTS: ci.invalid
      DJANGO_CSRF_TRUSTED_ORIGINS: https://ci.invalid

      TEST_POSTGRES_DB: test_firedash
      TEST_POSTGRES_USER: firedash_test
      TEST_POSTGRES_PASSWORD: firedash_test_ci
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install GeoDjango system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Provision PostgreSQL production and test databases
        env:
          PGPASSWORD: postgres_ci
          FIREDASH_DATABASE_OWNER_PASSWORD: database_owner_ci
          FIREDASH_APPLICATION_RUNTIME_PASSWORD: application_runtime_ci
          FIREDASH_BACKUP_ROLE_PASSWORD: backup_role_ci
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -f deploy/postgresql/bootstrap-production.sql

          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U postgres \
            -d postgres \
            -v application_runtime_password=application_runtime_ci \
            -v firedash_test_password=firedash_test_ci \
            -f deploy/postgresql/bootstrap-test.sql

      - name: Migrate and harden PostgreSQL production database
        env:
          PGPASSWORD: database_owner_ci
        run: |
          DJANGO_SETTINGS_MODULE=config.settings.production python manage.py migrate

          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U database_owner \
            -d fire_backend \
            -f deploy/postgresql/roles.sql

      - name: Assert PostgreSQL production privileges and backup access
        env:
          PGPASSWORD: database_owner_ci
        run: |
          runtime_role_is_unprivileged=$(psql -v ON_ERROR_STOP=1 -At \
            -h 127.0.0.1 -U database_owner -d fire_backend \
            -c "SELECT NOT (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls) FROM pg_roles WHERE rolname = 'application_runtime';")
          test "$runtime_role_is_unprivileged" = "t"

          for statement in \
            "UPDATE audit_event SET id = id" \
            "DELETE FROM audit_event" \
            "TRUNCATE audit_event" \
            "UPDATE publications_datasettyperegistry SET code = code"; do
            if PGPASSWORD=application_runtime_ci psql -v ON_ERROR_STOP=1 \
              -h 127.0.0.1 -U application_runtime -d fire_backend -c "$statement"; then
              echo "Runtime role unexpectedly executed: $statement" >&2
              exit 1
            fi
          done

          postgres_container="${{ job.services.postgres.id }}"

          docker exec \
            -e PGPASSWORD=backup_role_ci \
            "$postgres_container" \
            pg_dump \
              --format=custom \
              --file=/tmp/fire-backend-ci.dump \
              --host=127.0.0.1 \
              --username=backup_role \
              fire_backend

          docker exec \
            "$postgres_container" \
            pg_restore \
              --list /tmp/fire-backend-ci.dump \
              >/dev/null

          if PGPASSWORD=backup_role_ci psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 -U backup_role -d fire_backend \
            -c "UPDATE audit_event SET id = id"; then
            echo "backup_role unexpectedly has write access" >&2
            exit 1
          fi

      - name: Check deployment shell syntax
        run: |
          bash -n deploy/install.sh
          bash -n deploy/install-local.sh
          bash -n deploy/bootstrap-lxc.sh
          bash -n deploy/deploy-release.sh
          bash -n deploy/initialize-firedash.sh
          bash -n deploy/verify-deployment.sh
          for f in deploy/lib/*.sh; do bash -n "$f"; done
          bash -n deploy/scripts/create-service-users.sh
          bash -n deploy/scripts/fire-backup
          bash -n deploy/scripts/fire-restore
          bash -n deploy/scripts/fire-pdf-sanitize

      - name: Run deployment helper tests
        run: |
          bash deploy/tests/test_state.sh
          bash deploy/tests/test_postgres_bootstrap.sh
          bash deploy/tests/test_release_venv.sh
          bash deploy/tests/test_admin_state.sh

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Security scan
        run: bandit -r apps config manage.py --exclude "*/tests/*,*/migrations/*"

      - name: Dependency audit
        run: |
          pip-audit -r requirements/base.txt
          pip-audit -r requirements/dev.txt

      - name: Run PostgreSQL/PostGIS test suite
        run: pytest --ds=config.settings.test

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate
