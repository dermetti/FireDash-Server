name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: fire_backend
          POSTGRES_USER: database_owner
          POSTGRES_PASSWORD: database_owner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U database_owner -d fire_backend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-test-secret-not-for-production

      TEST_POSTGRES_DB: test_firedash
      TEST_POSTGRES_USER: firedash_test
      TEST_POSTGRES_PASSWORD: firedash_test_ci
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: "5432"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install GeoDjango system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/dev.txt

      - name: Create PostgreSQL roles and PostGIS test template
        env:
          PGPASSWORD: database_owner_ci
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U database_owner \
            -d fire_backend \
            -c "CREATE ROLE application_runtime LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'application_runtime_ci';" \
            -c "CREATE ROLE firedash_test LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD 'firedash_test_ci';"

          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U database_owner \
            -d fire_backend \
            -c "CREATE DATABASE firedash_test_template OWNER database_owner TEMPLATE template0;"

          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U database_owner \
            -d firedash_test_template \
            -c "CREATE EXTENSION postgis;" \
            -c "CREATE EXTENSION btree_gist;"

          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U database_owner \
            -d fire_backend \
            -c "ALTER DATABASE firedash_test_template IS_TEMPLATE true;" \
            -c "ALTER DATABASE firedash_test_template ALLOW_CONNECTIONS false;"

      - name: Verify PostgreSQL roles
        env:
          PGPASSWORD: database_owner_ci
        run: |
          psql -v ON_ERROR_STOP=1 \
            -h 127.0.0.1 \
            -U database_owner \
            -d fire_backend \
            -c "\du database_owner" \
            -c "\du application_runtime" \
            -c "\du firedash_test"

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy .

      - name: Security scan
        run: bandit -r apps config manage.py --exclude "*/tests/*,*/migrations/*"

      - name: Dependency audit
        run: |
          pip-audit -r requirements/base.txt
          pip-audit -r requirements/dev.txt

      - name: Run PostgreSQL/PostGIS test suite
        run: pytest --ds=config.settings.test

      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate