[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["apps", "config"]
# Use the repository's fixed, guarded scratch base instead of pytest's
# per-user default under %TEMP%.  The latter can be left with sandbox-only
# ACLs on Windows.  conftest.py removes this base at session start/finish.
addopts = "--strict-markers --basetemp=.test-tmp"
tmp_path_retention_policy = "none"
markers = [
    "slow: large-scale coverage run separately from routine focused tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = [".venv", "migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["django_otp.*", "qrcode"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = [".venv", "apps/*/migrations"]
