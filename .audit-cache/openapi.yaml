openapi: 3.1.0
info:
  title: FireDash Provisioning API
  version: 1.0.0
paths:
  /api/v1/adoption/complete:
    post:
      operationId: adoption_complete_create
      description: Apply private/no-store semantics to every tablet protocol response.
      tags:
      - adoption
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptionComplete'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionCompleteResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
  /api/v1/adoption/preview:
    post:
      operationId: adoption_preview_create
      description: Apply private/no-store semantics to every tablet protocol response.
      tags:
      - adoption
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdoptionPreview'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdoptionPreviewResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/check-in:
    post:
      operationId: tablet_check_in_create
      description: Accepts an empty JSON object or no request body. Tablet storage
        telemetry is disabled. App version and build headers remain supported.
      parameters:
      - in: header
        name: X-FireDash-App-Build
        schema:
          type: integer
      - in: header
        name: X-FireDash-App-Version
        schema:
          type: string
      tags:
      - tablet
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: {}
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/configuration:
    get:
      operationId: tablet_configuration_retrieve
      description: Apply private/no-store semantics to every tablet protocol response.
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigurationResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/datasets/{publication_id}/download:
    get:
      operationId: tablet_datasets_download_retrieve
      description: Apply private/no-store semantics to every tablet protocol response.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
      - in: path
        name: publication_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          headers:
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '304':
          headers:
            ETag:
              schema:
                type: string
          description: No response body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/document-generations/{publication_id}/artifacts/{artifact_id}/download:
    get:
      operationId: tablet_document_generations_artifacts_download_retrieve
      description: Immutable document ciphertext referenced by this generation. Requires
        current generation authorization and a READY generation-key grant for this
        installation. The quoted ETag is ciphertext_sha256. Only an exact If-None-Match
        match returns 304 (no body); otherwise download and verify the entire ciphertext.
        AES-256-GCM uses the signed nonce, no AAD and an appended authentication tag.
        Verify ciphertext length/hash, then plaintext SHA-256 and file.size_bytes.
        Artifact signature metadata is server-only; clients verify the generation
        manifest.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
      - in: path
        name: artifact_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: publication_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          headers:
            ETag:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
          description: ''
        '304':
          headers:
            ETag:
              schema:
                type: string
          description: No response body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/document-generations/{publication_id}/manifest:
    get:
      operationId: tablet_document_generations_manifest_retrieve
      description: 'Complete signed schema-v2 document snapshot for an authorized
        current generation (or retained successful file-library generation within
        the current scope). Rechecks current installation, assignment, lease, dataset
        visibility and app compatibility. No conditional GET: this endpoint emits
        no ETag and never returns 304.'
      parameters:
      - in: path
        name: publication_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: 'format=document-generation-v2; dataset_type, publication_id,
            version, schema_version=2 and complete documents array. File datasets
            additionally include source_revision, library={id,name,scope} and the
            complete folders array ({id,name,parent_id}). Each file document includes
            file={id,name,folder_id,size_bytes,sha256} and the shared artifact envelope:
            artifact_id, sanitized_pdf_sha256, ciphertext_sha256, ciphertext_size,
            nonce, encryption_algorithm, wrapping_algorithm, kek_version, signature,
            signature_algorithm, signing_key_version, generation_wrapped_cek, generation_key_wrapping_algorithm
            and download_path. KLGV documents instead carry klgv_plan metadata; Fire
            Plans carry fire_plan metadata. Top-level signature, signature_algorithm
            and signing_key_version authenticate canonical JSON before those response-only
            fields and generation_key_grant are attached. generation_key_grant contains
            scheme, ciphersuite, encapsulated_key, wrapped_generation_key and info.
            Validate info''s protocol=firedash-document-generation-hpke-v2, publication_id,
            installation_id, tablet_id, scope, version_number and schema_version.
            HPKE opens the generation key; AES-KW unwraps each document CEK. Empty
            document/folder arrays are valid authoritative snapshots. See docs/tablet-api.md
            for canonical signing and complete activation rules.'
        '202':
          headers:
            Retry-After:
              schema:
                type: integer
          description: Generation-key grant pending; empty body. Retry after 5 seconds.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/manifest:
    get:
      operationId: tablet_manifest_retrieve
      description: Apply private/no-store semantics to every tablet protocol response.
      parameters:
      - in: header
        name: If-None-Match
        schema:
          type: string
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: Complete Ed25519-signed tablet manifest (docs/tablet-api.md,
            Complete manifest). Includes configuration, authorization_valid_until,
            manifest_generation, generated_at, capabilities and datasets, plus signature,
            signature_algorithm and signing_key_version. Dataset descriptors include
            publication_id, type, scope, version, schema_version, required and minimum_app_version.
            File datasets use artifact_format=document-manifest-v2 and manifest_url,
            not a monolithic download_url. JSON datasets carry their encryption metadata
            and key_grant. The quoted response ETag excludes only generated_at; matching
            If-None-Match returns 304 without a body. A pending complete manifest
            returns a 202 problem.
        '202':
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ManifestPendingResponse'
          description: ''
        '304':
          headers:
            ETag:
              schema:
                type: string
          description: No response body
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/refresh:
    post:
      operationId: tablet_refresh_create
      description: Explicit user-requested lease top-up. No request body; this is
        distinct from check-in and does not record storage telemetry. Requires an
        ACTIVE, unexpired, operational installation.
      parameters:
      - in: header
        name: X-FireDash-App-Build
        schema:
          type: integer
      - in: header
        name: X-FireDash-App-Version
        schema:
          type: string
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/report-delivery:
    post:
      operationId: tablet_report_delivery_create
      description: 'Authenticated multipart submission. The UUID is installation-scoped
        and durable: replays never invoke delivery again. All admitted-delivery outcomes,
        including idempotency conflict and indeterminate delivery, use the documented
        200 response.'
      summary: Deliver one encrypted report PDF
      tags:
      - tablet
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportDelivery'
        required: true
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDeliveryResponse'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/report-submissions:
    post:
      operationId: tablet_report_submissions_create
      description: Apply private/no-store semantics to every tablet protocol response.
      tags:
      - tablet
      requestBody:
        content:
          application/json:
            schema:
              type: object
      security:
      - InstallationBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
          description: ''
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/tablet/report-submissions/{submission_id}/status:
    get:
      operationId: tablet_report_submissions_status_retrieve
      description: Apply private/no-store semantics to every tablet protocol response.
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/tablet/report-transfers:
    post:
      operationId: tablet_report_transfers_create
      description: Apply private/no-store semantics to every tablet protocol response.
      tags:
      - tablet
      requestBody:
        content:
          application/json:
            schema:
              type: object
      security:
      - InstallationBearer: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
          description: ''
        '200':
          content:
            application/json:
              schema:
                type: object
          description: ''
  /api/v1/tablet/report-transfers/{transfer_id}/revoke:
    post:
      operationId: tablet_report_transfers_revoke_create
      description: Apply private/no-store semantics to every tablet protocol response.
      parameters:
      - in: path
        name: transfer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - transfer_id
                - status
                properties:
                  transfer_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - REVOKED
          description: ''
  /api/v1/tablet/signing-keys/{version}:
    get:
      operationId: tablet_signing_keys_retrieve
      description: Fetch the exact requested Ed25519 signing-key version, not a latest-key
        alias. Returns algorithm, version and the Base64 raw public_key (32 bytes).
        Requires current installation/assignment authorization, including for old
        public keys.
      parameters:
      - in: path
        name: version
        schema:
          type: string
        required: true
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKeyResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
        '426':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ClientUpdateRequiredResponse'
          description: ''
  /api/v1/tablet/status:
    get:
      operationId: tablet_status_retrieve
      description: Apply private/no-store semantics to every tablet protocol response.
      tags:
      - tablet
      security:
      - InstallationBearer: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: ''
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemResponse'
          description: ''
components:
  schemas:
    AdoptionComplete:
      type: object
      properties:
        adoption_request_id:
          type: string
          format: uuid
        challenge_response:
          type: string
        confirmed:
          type: boolean
      required:
      - adoption_request_id
      - challenge_response
      - confirmed
    AdoptionCompleteResponse:
      type: object
      properties:
        installation_id:
          type: string
          format: uuid
        credential:
          type: string
        authorization_valid_until:
          type: string
          format: date-time
        server_time:
          type: string
          format: date-time
      required:
      - authorization_valid_until
      - credential
      - installation_id
      - server_time
    AdoptionPreview:
      type: object
      properties:
        token:
          type: string
          maxLength: 256
        installation_uuid:
          type: string
          format: uuid
        app_version:
          type: string
          maxLength: 64
        app_build:
          type: integer
          minimum: 1
        hpke_public_key:
          type: string
        hpke_ciphersuite:
          type: string
          maxLength: 128
      required:
      - app_version
      - hpke_ciphersuite
      - hpke_public_key
      - installation_uuid
      - token
    AdoptionPreviewResponse:
      type: object
      properties:
        adoption_request_id:
          type: string
          format: uuid
        encrypted_challenge:
          type: string
        expires_at:
          type: string
          format: date-time
        tablet_id:
          type: string
          format: uuid
        hpke_ciphersuite:
          type: string
        hpke_public_key_fingerprint:
          type: string
        mode:
          type: string
        protocol:
          type: string
      required:
      - adoption_request_id
      - encrypted_challenge
      - expires_at
      - hpke_ciphersuite
      - hpke_public_key_fingerprint
      - mode
      - protocol
      - tablet_id
    CheckInResponse:
      type: object
      properties:
        status:
          type: string
        server_time:
          type: string
          format: date-time
        authorization_valid_until:
          type: string
          format: date-time
      required:
      - authorization_valid_until
      - server_time
      - status
    ClientUpdateRequiredResponse:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        minimum_app_version:
          type: string
      required:
      - code
      - detail
      - minimum_app_version
      - request_id
      - status
      - title
      - type
    CodeEnum:
      enum:
      - delivered
      - recipient_not_authorized
      - recipient_email_unavailable
      - recipient_domain_not_allowed
      - invalid_attachment
      - attachment_too_large
      - invalid_pdf
      - unsupported_pdf_encryption
      - pdf_inspection_unavailable
      - provider_unavailable
      - message_rejected
      - provider_configuration
      - delivery_unavailable
      - delivery_indeterminate
      - idempotency_conflict
      type: string
      description: |-
        * `delivered` - delivered
        * `recipient_not_authorized` - recipient_not_authorized
        * `recipient_email_unavailable` - recipient_email_unavailable
        * `recipient_domain_not_allowed` - recipient_domain_not_allowed
        * `invalid_attachment` - invalid_attachment
        * `attachment_too_large` - attachment_too_large
        * `invalid_pdf` - invalid_pdf
        * `unsupported_pdf_encryption` - unsupported_pdf_encryption
        * `pdf_inspection_unavailable` - pdf_inspection_unavailable
        * `provider_unavailable` - provider_unavailable
        * `message_rejected` - message_rejected
        * `provider_configuration` - provider_configuration
        * `delivery_unavailable` - delivery_unavailable
        * `delivery_indeterminate` - delivery_indeterminate
        * `idempotency_conflict` - idempotency_conflict
    ConfigurationResponse:
      type: object
      properties:
        installation_id:
          type: string
          format: uuid
        tablet_id:
          type: string
          format: uuid
        department_id:
          type: string
          format: uuid
        station_id:
          type:
          - string
          - 'null'
          format: uuid
        vehicle_id:
          type:
          - string
          - 'null'
          format: uuid
        report_delivery_max_attachment_bytes:
          type: integer
          minimum: 1
        report_transfer: {}
      required:
      - department_id
      - installation_id
      - report_delivery_max_attachment_bytes
      - report_transfer
      - station_id
      - tablet_id
      - vehicle_id
    ManifestPendingResponse:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
        manifest_request_id:
          type: string
          format: uuid
      required:
      - code
      - detail
      - manifest_request_id
      - request_id
      - status
      - title
      - type
    ProblemResponse:
      type: object
      description: Stable RFC 9457 members shared by ordinary tablet problem responses.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        request_id:
          type: string
      required:
      - code
      - detail
      - request_id
      - status
      - title
      - type
    ReportDelivery:
      type: object
      properties:
        delivery_request_id:
          type: string
          format: uuid
          description: Client-generated UUID for one intentional logical delivery.
        recipient_personnel_id:
          type: string
          format: uuid
          description: The person UUID from the current station_personnel dataset.
        pdf:
          type: string
          format: binary
          description: Password-required AES-256 revision-6 (AESV3) PDF. The password
            is never uploaded. The deployment enforces its configured report attachment
            size limit.
      required:
      - delivery_request_id
      - pdf
      - recipient_personnel_id
    ReportDeliveryResponse:
      type: object
      properties:
        state:
          $ref: '#/components/schemas/StateEnum'
        code:
          $ref: '#/components/schemas/CodeEnum'
      required:
      - code
      - state
    SigningKeyResponse:
      type: object
      properties:
        algorithm:
          type: string
        version:
          type: string
        public_key:
          type: string
      required:
      - algorithm
      - public_key
      - version
    StateEnum:
      enum:
      - SUCCESS
      - FAILED
      - UNKNOWN
      - CONFLICT
      type: string
      description: |-
        * `SUCCESS` - SUCCESS
        * `FAILED` - FAILED
        * `UNKNOWN` - UNKNOWN
        * `CONFLICT` - CONFLICT
    StatusResponse:
      type: object
      properties:
        status:
          type: string
        authorization_valid_until:
          type: string
          format: date-time
        purge_provisioned_data:
          type: boolean
        server_time:
          type: string
          format: date-time
      required:
      - authorization_valid_until
      - purge_provisioned_data
      - server_time
      - status
  securitySchemes:
    InstallationBearer:
      type: http
      scheme: bearer
      bearerFormat: installation credential
