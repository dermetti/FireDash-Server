{% extends "accounts/auth_base.html" %}
{% block title %}Verify authentication | FireDash{% endblock %}
{% block auth_content %}
<h1 class="h4 mb-2">Verify authentication</h1>
<p class="text-body-secondary">Enter the code from your authenticator app.</p>
<form method="post">{% csrf_token %}
  {% include "components/_form_field.html" with field=form.token %}
  <button class="btn btn-primary w-100">Verify</button>
</form>
{% endblock %}
