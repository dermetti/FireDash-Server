<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Setup — FireDash</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container mt-5" style="max-width:400px">
<h1 class="text-center mb-4">Account Setup</h1>
{% if messages %}{% for message in messages %}<div class="alert alert-danger">{{ message }}</div>{% endfor %}{% endif %}
<div class="card"><div class="card-body">
<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary w-100">Set password</button></form>
</div></div>
</div></body></html>
