{% extends "accounts/auth_base.html" %}
{% block title %}Sign in | FireDash{% endblock %}
{% block auth_content %}<div id="authentication-card"><h1 class="h4 mb-3">Sign in</h1><form method="post" novalidate hx-post="{% url 'accounts-login' %}" hx-target="#authentication-card" hx-swap="outerHTML">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<button class="btn btn-primary w-100">Sign in</button></form></div>{% endblock %}
