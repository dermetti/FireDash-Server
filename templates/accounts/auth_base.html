{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FireDash{% endblock %}</title>
  <link href="{% static 'vendor/bootstrap/bootstrap.min.css' %}" rel="stylesheet">
  <script defer src="{% static 'vendor/alpine/alpine.min.js' %}"></script>
  <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
  {% block head %}{% endblock %}
</head>
<body class="bg-body-tertiary" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <main class="container py-5" style="max-width:30rem">
    <div class="text-center mb-4">
      <a class="h2 text-decoration-none text-body" href="{% url 'accounts-login' %}">FireDash</a>
      <p class="text-body-secondary mb-0">Secure administration</p>
    </div>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <section class="card shadow-sm">
      <div class="card-body p-4">
        {% block auth_content %}{% endblock %}
      </div>
    </section>
  </main>
  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
