<div id="authentication-card">
  <h1 class="h4 mb-2">Verify authentication</h1>
  <p class="text-muted">Enter the code from your authenticator app.</p>
  <form method="post" action="{% url 'accounts-mfa-verify' %}" hx-post="{% url 'accounts-mfa-verify' %}" hx-target="#authentication-card" hx-swap="outerHTML">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
    <div class="mb-3">{{ form.token.label_tag }}{{ form.token }}{% for error in form.token.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>
    <button class="btn btn-primary w-100">Verify</button>
  </form>
</div>
