<div class="modal fade" id="stage3ActionModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#hydrant-action-modal-container" hx-swap="innerHTML">{% csrf_token %}<div class="modal-header"><h2 class="h5">Edit Data</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body">{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="modal-footer"><button type="submit" class="btn btn-primary">Save</button></div></form></div></div></div>
