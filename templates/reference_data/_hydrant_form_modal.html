<div class="modal-dialog"><div class="modal-content"><form method="post" action="{{ request.path }}">{% csrf_token %}<div class="modal-header"><h2 class="h5">Edit Data</h2></div><div class="modal-body">{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="modal-footer"><button class="btn btn-primary">Save</button></div></form></div></div>
