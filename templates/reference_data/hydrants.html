<!doctype html>
<html lang="en"><body><main><h1>{{ department.name }} hydrants</h1><p><a href="{% url 'reference-data-hydrant-create' department.id %}">Create hydrant</a></p><ul>{% for hydrant in hydrants %}<li><a href="{% url 'reference-data-hydrant-manage' hydrant.id %}">{{ hydrant.external_identifier|default:hydrant.id }}</a> {{ hydrant.location.y }}, {{ hydrant.location.x }}</li>{% empty %}<li>No hydrants.</li>{% endfor %}</ul><h2>Import GeoJSON</h2><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<button>Preview import</button></form></main></body></html>
