<div class="modal-header"><h2 class="modal-title fs-5">Edit Fire Plan data</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form method="post" hx-post="{{ request.path }}" hx-target="#fire-plan-modal-content" hx-swap="innerHTML">{% csrf_token %}<div class="modal-body">{{ form.non_field_errors }}{% for field in form %}<div class="mb-3">{{ field.label_tag }}{{ field }}{{ field.errors }}</div>{% endfor %}</div><div class="modal-footer"><button type="submit" class="btn btn-primary">Save</button></div></form>
