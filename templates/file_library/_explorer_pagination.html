<nav aria-label="File explorer pages"><ul class="pagination pagination-sm mb-0">
<li class="page-item{% if not page.has_previous %} disabled{% endif %}">{% if page.has_previous %}<a class="page-link" href="?{{ previous_querystring }}" hx-get="?{{ previous_querystring }}" hx-target="#file-explorer-content" hx-swap="innerHTML" hx-push-url="true">Previous</a>{% else %}<span class="page-link" aria-disabled="true">Previous</span>{% endif %}</li>
<li class="page-item disabled"><span class="page-link" aria-current="page">Page {{ page.number }} of {{ page.paginator.num_pages }}</span></li>
<li class="page-item{% if not page.has_next %} disabled{% endif %}">{% if page.has_next %}<a class="page-link" href="?{{ next_querystring }}" hx-get="?{{ next_querystring }}" hx-target="#file-explorer-content" hx-swap="innerHTML" hx-push-url="true">Next</a>{% else %}<span class="page-link" aria-disabled="true">Next</span>{% endif %}</li>
</ul></nav>
