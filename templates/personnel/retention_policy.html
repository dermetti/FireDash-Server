{% extends "base.html" %}
{% block title %}{{ department.name }} Retention Policy{% endblock %}
{% block content %}
<p class="mb-1"><a href="{% url 'personnel-list' department.id %}">Back to Personnel</a></p><h1>Retention Policy</h1>
<section class="card"><div class="card-body"><form method="post">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endfor %}<button type="submit" class="btn btn-primary">Save</button></form></div></section>
{% endblock %}
