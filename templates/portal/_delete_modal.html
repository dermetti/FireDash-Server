<div class="modal fade" id="stage3ActionModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form method="post" action="{{ action_url }}" hx-post="{{ action_url }}" hx-target="#{{ modal_container_id }}" hx-swap="innerHTML">{% csrf_token %}<div class="modal-header"><h2 class="h5 text-danger">Delete Data</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><p>This permanently deletes <strong>{{ object }}</strong>. Protected history will prevent deletion.</p>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}</div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger">Delete Data</button></div></form></div></div></div>
