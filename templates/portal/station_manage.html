<!doctype html>
<html lang="en"><body><main><h1>{{ station.name }}</h1><a href="{% url 'portal-vehicles' station.id %}">Vehicles</a>{% if department_admin %}<form method="post">{% csrf_token %}<input type="hidden" name="action" value="station">{{ form.as_p }}<button>Save station</button></form><h2>Station administrators</h2><ul>{% for assignment in assignments %}<li>{{ assignment.user.display_name }}</li>{% endfor %}</ul><form method="post">{% csrf_token %}<input type="hidden" name="action" value="provision">{{ admin_form.as_p }}<button>Create station administrator</button></form>{% endif %}</main></body></html>
