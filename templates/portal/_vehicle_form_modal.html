<div class="modal fade" id="stage3ActionModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#{{ modal_container_id }}" hx-swap="innerHTML">{% csrf_token %}<div class="modal-header"><h2 class="h5">{% if vehicle %}Edit Data{% else %}Create Vehicle{% endif %}</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body">{% for field in form %}{% if field.name != 'active' %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endif %}{% endfor %}</div><div class="modal-footer"><button type="submit" class="btn btn-primary">Save</button></div></form></div></div></div>
