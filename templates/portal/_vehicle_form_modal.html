<div class="modal fade" id="stage3ActionModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content"><form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#{{ modal_container_id }}" hx-swap="innerHTML">{% csrf_token %}<div class="modal-header"><h2 class="modal-title fs-5">{% if vehicle %}Edit Data{% else %}Create Vehicle{% endif %}</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body">{% for field in form %}{% if field.name != 'active' %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}</div>{% endif %}{% endfor %}</div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div></form></div></div></div>
