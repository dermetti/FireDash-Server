<div class="modal fade" id="stage4DepartmentAdminModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-scrollable modal-fullscreen-sm-down"><div class="modal-content"><form method="post" action="{{ request.path }}" hx-post="{{ request.path }}" hx-target="#department-admin-modal-container" hx-swap="innerHTML">{% csrf_token %}<div class="modal-header"><h2 class="modal-title fs-5 text-danger">Revoke administrator access</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div><div class="modal-body"><p>Revoke <strong>{{ membership.user.display_name }}</strong>’s Department Administrator access to {{ department.name }}?</p><p class="text-body-secondary mb-0">This is a security-relevant change. The account will no longer administer this department.</p></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-danger">Revoke access</button></div></form></div></div></div>
