{% for error in form.non_field_errors %}<div class="alert alert-danger py-2">{{ error }}</div>{% endfor %}
<div class="mb-3">
  <label class="form-label" for="id_vehicle_id">Vehicle</label>
  <select name="vehicle_id" id="id_vehicle_id" class="form-select" required>
    <option value="">Select vehicle&hellip;</option>
    {% for v in vehicles %}
    <option value="{{ v.id }}" {% if form.vehicle_id.value|stringformat:"s" == v.id|stringformat:"s" %}selected{% endif %}>{{ v.display_name }} &mdash; {{ v.station.name }}</option>
    {% endfor %}
  </select>
  <div class="form-text">The vehicle and its station determine where this tablet reports.</div>
  {% for error in form.vehicle_id.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
