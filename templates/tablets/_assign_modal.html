<div class="modal fade" id="tabletActionModal" tabindex="-1" aria-labelledby="tabletActionModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form method="post" hx-post="{% url 'tablet-assign' department.id tablet.id %}" hx-target="#tablet-action-modal-container" hx-swap="innerHTML">
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <div class="modal-header">
          <h5 class="modal-title" id="tabletActionModalLabel">{% if vehicle %}Transfer tablet{% else %}Assign vehicle{% endif %}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="mb-3">Tablet: <strong>{{ tablet.display_name|default:"Unnamed tablet" }}</strong>
            {% if tablet.asset_number %}<span class="text-body-secondary">({{ tablet.asset_number }})</span>{% endif %}</p>
          {% include "tablets/_assign_fields.html" %}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">{% if vehicle %}Transfer tablet{% else %}Assign vehicle{% endif %}</button>
        </div>
      </form>
    </div>
  </div>
</div>
