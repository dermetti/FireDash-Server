{% load department_presentation %}
<div id="tablet-status-summary"
     hx-get="{% url 'tablet-status-summary' department.id %}"
     hx-trigger="every 30s"
     hx-swap="outerHTML">
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <h2 class="h6 text-body-secondary mb-3">Tablet assets
        <button type="button" class="btn btn-link btn-sm p-0 align-baseline text-decoration-none"
                aria-label="About tablet assets"
                data-bs-toggle="popover" data-bs-trigger="focus" title="Tablet assets"
                data-bs-content="Counts of registered physical tablets by their current asset state.">?</button>
      </h2>
      <div class="d-flex gap-4 flex-wrap">
        <div>
          <div class="fs-5 fw-semibold">{{ counts.operational }}</div>
          <div class="text-body-secondary small">Current tablets</div>
        </div>
        <div>
          <div class="fs-5 fw-semibold text-success">{{ counts.active }}</div>
          <div class="text-body-secondary small">Active</div>
        </div>
        <div>
          <div class="fs-5 fw-semibold text-secondary">{{ counts.inactive }}</div>
          <div class="text-body-secondary small">Inactive</div>
        </div>
        <div>
          <div class="fs-5 fw-semibold text-danger">{{ counts.lost }}</div>
          <div class="text-body-secondary small">Lost</div>
        </div>
      </div>
      <div class="text-body-secondary small mt-3">
        {{ counts.retired }} retired &middot;
        Last updated {{ last_updated|department_datetime:department }} &middot; Updates automatically
      </div>
    </div>
  </div>
</div>
