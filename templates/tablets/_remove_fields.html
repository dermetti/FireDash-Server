{% for error in form.non_field_errors %}<div class="alert alert-danger py-2">{{ error }}</div>{% endfor %}
<div class="mb-3">
  <label class="form-label" for="{{ form.status.id_for_label }}">Status</label>
  {{ form.status }}
  {% for error in form.status.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
<div class="mb-3">
  <label class="form-label" for="{{ form.reason.id_for_label }}">Reason</label>
  {{ form.reason }}
  <div class="form-text">Optional note recorded for the audit log.</div>
  {% for error in form.reason.errors %}<div class="invalid-feedback d-block">{{ error }}</div>{% endfor %}
</div>
