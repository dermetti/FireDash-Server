{% if page.has_other_pages %}
<nav class="d-flex align-items-center gap-2" aria-label="Pagination">
  {% if page.has_previous %}
    <a class="btn btn-sm btn-outline-primary"
       href="?page={{ page.previous_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}"
       {% if hx_target %}hx-get="{{ hx_base }}?page={{ page.previous_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}" hx-target="{{ hx_target }}"{% if hx_swap %} hx-swap="{{ hx_swap }}"{% endif %} hx-push-url="true"{% endif %}
       aria-label="Previous page">Previous</a>
  {% else %}
    <span class="btn btn-sm btn-outline-secondary disabled" aria-hidden="true">Previous</span>
  {% endif %}
  <span class="text-body-secondary small">Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  {% if page.has_next %}
    <a class="btn btn-sm btn-outline-primary"
       href="?page={{ page.next_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}"
       {% if hx_target %}hx-get="{{ hx_base }}?page={{ page.next_page_number }}{% if page_query %}&amp;{{ page_query }}{% endif %}" hx-target="{{ hx_target }}"{% if hx_swap %} hx-swap="{{ hx_swap }}"{% endif %} hx-push-url="true"{% endif %}
       aria-label="Next page">Next</a>
  {% else %}
    <span class="btn btn-sm btn-outline-secondary disabled" aria-hidden="true">Next</span>
  {% endif %}
</nav>
{% endif %}
