<div id="{{ modal_container_id }}"></div>
<script>
  (function () {
    var container = document.getElementById("{{ modal_container_id }}");
    if (!container || container.dataset.modalController) return;
    container.dataset.modalController = "true";
    var activeModal = null;

    function showModal() {
      var modalEl = container.querySelector(".modal");
      if (!modalEl) return;
      var instance = bootstrap.Modal.getInstance(modalEl);
      if (instance) instance.dispose();
      document.querySelectorAll(".modal-backdrop").forEach(function (backdrop) {
        backdrop.remove();
      });
      activeModal = bootstrap.Modal.getOrCreateInstance(modalEl);
      activeModal.show();
    }

    document.body.addEventListener("htmx:afterSwap", function (event) {
      if (event.target === container) showModal();
    });
    document.body.addEventListener("hidden.bs.modal", function (event) {
      if (container.contains(event.target)) {
        activeModal = null;
        container.innerHTML = "";
      }
    });
    document.body.addEventListener("phonebook-modal-close", function () {
      if (activeModal) activeModal.hide();
    });
  })();
</script>
