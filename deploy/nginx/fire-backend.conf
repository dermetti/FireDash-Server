upstream fire_backend {
    server unix:/run/fire-backend/gunicorn.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __SERVER_NAME__;

    ssl_certificate __TLS_CERT_PATH__;
    ssl_certificate_key __TLS_KEY_PATH__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;

    # Outer request-size boundary. The application enforces the aggregate
    # file/archive ceiling (MAX_INGEST_UPLOAD_BYTES = 256 MiB) precisely; Nginx
    # sits modestly higher so multipart framing overhead cannot clip a
    # near-256-MiB upload before Django validates it. Individual PDFs are bounded
    # separately by MAX_PDF_INPUT_BYTES (100 MiB) in Django.
    client_max_body_size 300m;
    server_tokens off;

    location /static/ {
        alias /var/lib/fire-backend/static/;
        access_log off;
        expires 1h;
    }

    # Setup URLs contain one-time secrets and must not enter access logs.
    location ~ ^/accounts/setup/ {
        access_log off;
        proxy_pass http://fire_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django authorizes each request then sends only a server-generated <uuid>.bin URI.
    location /internal-protected-datasets/ {
        internal;
        alias /var/lib/fire-backend/publications/;
        # Preserve Django's cryptographic artifact identity across X-Accel-Redirect.
        etag off;
        add_header ETag $upstream_http_etag always;
    }

    location / {
        proxy_pass http://fire_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 95s;
    }
}
